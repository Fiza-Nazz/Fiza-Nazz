<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <!-- Glowing Cyan/Emerald/Purple AI Gradient -->
    <linearGradient id="aiTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="40%" stop-color="#38EF7D" />
      <stop offset="75%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- Subtitle Glow -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38EF7D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern for Neural/AI vibe -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#00F5FF" fill-opacity="0.3" />
    </pattern>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Card with Rounded Corners -->
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#grid)" />
  <rect x="2" y="2" width="996" height="256" rx="16" fill="url(#centerGlow)" />
  <rect x="2" y="2" width="996" height="256" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Top Status Strip -->
  <g transform="translate(50, 36)">
    <!-- Status Dot -->
    <circle cx="6" cy="6" r="4" fill="#38EF7D">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38EF7D" letter-spacing="1.5">AVAILABLE FOR HIGH-IMPACT COLLABORATIONS</text>

    <!-- Location Badge -->
    <text x="750" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" letter-spacing="1">📍 PAKISTAN 🇵🇰  •  ⭐ 112+ REPOSITORIES</text>
  </g>

  <!-- Horizontal divider line -->
  <line x1="50" y1="56" x2="950" y2="56" stroke="#1E293B" stroke-width="1" />

  <!-- Main Name Title -->
  <text x="500" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', sans-serif" font-size="54" font-weight="900" fill="url(#aiTitleGrad)" letter-spacing="4">
    FIZA NAZZ
  </text>

  <!-- Subtitle: High-Fi Titles -->
  <text x="500" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="url(#subGrad)" letter-spacing="3.5">
    AI ENGINEER  ✦  FULL-STACK DEVELOPER  ✦  SAAS BUILDER
  </text>

  <!-- High-Tech Tag Pills at Bottom -->
  <g transform="translate(140, 202)">
    <!-- Pill 1: Agentic AI -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#0C1929" stroke="#00F5FF" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00F5FF">🤖 Agentic AI</text>

    <!-- Pill 2: Multi-Agent RAG -->
    <rect x="145" y="0" width="145" height="28" rx="14" fill="#0C1929" stroke="#38EF7D" stroke-width="1" />
    <text x="217" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38EF7D">⚡ Multi-Agent RAG</text>

    <!-- Pill 3: Next.js & React -->
    <rect x="305" y="0" width="130" height="28" rx="14" fill="#0C1929" stroke="#00E5FF" stroke-width="1" />
    <text x="370" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00E5FF">🌐 Next.js &amp; React</text>

    <!-- Pill 4: PHP & Laravel -->
    <rect x="450" y="0" width="135" height="28" rx="14" fill="#0C1929" stroke="#FF2D20" stroke-width="1" />
    <text x="517" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FF2D20">🐘 PHP &amp; Laravel</text>

    <!-- Pill 5: Cloud DevOps -->
    <rect x="600" y="0" width="125" height="28" rx="14" fill="#0C1929" stroke="#9D4EDD" stroke-width="1" />
    <text x="662" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#9D4EDD">☁️ Cloud DevOps</text>
  </g>
</svg>
